name: DR lipid E2E test

on:
  push:
    branches: [dr-lipid-daily]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install requests
      - name: Compile project
        run: python -m py_compile code/weekly_brief.py code/send_weekly_email.py code/daily_pipeline.py code/literature_sources.py code/relevance_ranker.py
      - name: Check QQMAIL secret presence
        env:
          QQMAIL: ${{ secrets.QQMAIL }}
        run: test -n "$QQMAIL"
      - name: Generate weekly report without sending email
        run: python code/weekly_brief.py --days 21 --per-query 30 --top-n 20 --minimum-score 40 --output-dir Output/e2e
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: dr-lipid-e2e-report-${{ github.run_number }}
          path: Output/e2e/
