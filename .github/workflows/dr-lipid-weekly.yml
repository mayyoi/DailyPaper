name: DR lipid weekly brief

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Monday 08:00 China/Singapore time (UTC+8)

permissions:
  contents: read

concurrency:
  group: dr-lipid-weekly-brief
  cancel-in-progress: false

jobs:
  weekly-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests
      - name: Check QQ mail secret without exposing its value
        env:
          QQMAIL: ${{ secrets.QQMAIL }}
        run: |
          if [ -z "$QQMAIL" ]; then
            echo '::error::Repository secret QQMAIL is unavailable to this workflow.'
            exit 1
          fi
          echo 'QQMAIL secret is available.'
      - name: Generate dynamic weekly brief
        env:
          WEEKLY_DAYS: '21'
          WEEKLY_PER_QUERY: '80'
          WEEKLY_MINIMUM_SCORE: '55'
          WEEKLY_HARD_MAX: '60'
          WEEKLY_OUTPUT_DIR: Output/weekly
        run: python code/weekly_brief.py
      - name: Send weekly brief to QQ mailbox
        env:
          QQ_SMTP_PASSWORD: ${{ secrets.QQMAIL }}
          QQ_SENDER_EMAIL: 171142515@qq.com
          QQ_RECEIVER_EMAIL: 171142515@qq.com
        run: |
          python code/send_weekly_email.py \
            --html Output/weekly/$(date +%F).html \
            --md Output/weekly/$(date +%F).md \
            --json Output/weekly/$(date +%F).json
      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-lipid-weekly-brief-${{ github.run_number }}
          path: Output/weekly/
          if-no-files-found: warn
