name: DR lipid weekly brief

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Monday 08:00 China/Singapore time (UTC+8)

permissions:
  contents: write

concurrency:
  group: dr-lipid-weekly-brief
  cancel-in-progress: true

jobs:
  weekly-brief:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Update weekly literature history')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests
      - name: Check QQ mail secret without exposing its value
        env:
          QQMAIL: ${{ secrets.QQMAIL }}
        run: |
          if [ -z "$QQMAIL" ]; then
            echo '::error::Repository secret QQMAIL is unavailable to this workflow.'
            exit 1
          fi
          echo 'QQMAIL secret is available.'
      - name: Generate dynamic weekly brief
        env:
          WEEKLY_DAYS: '21'
          WEEKLY_PER_QUERY: '80'
          WEEKLY_MINIMUM_SCORE: '55'
          WEEKLY_HARD_MAX: '60'
          WEEKLY_OUTPUT_DIR: Output/weekly
          WEEKLY_HISTORY_PATH: data/weekly_history.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_OPENAI_MODEL: 'gpt-5'
          TRANSLATION_DEBUG: '1'
        run: python code/weekly_brief.py
      - name: Validate report encoding and translation quality and history deduplication
        run: |
          python - <<'PY'
          import json, pathlib, re
          out=pathlib.Path('Output/weekly')
          d=sorted(out.glob('*.json'))[-1]
          payload=json.loads(d.read_text(encoding='utf-8'))
          html=sorted(out.glob('*.html'))[-1].read_text(encoding='utf-8')
          bad=[]
          for x in payload.get('papers',[]):
            z=x.get('annotation',{}).get('abstract_zh','') or ''
            if any(t in z for t in ('�','Ã','Â','â€','ðŸ','æµ','ç”','ï¿½')) or '【自动翻译服务暂不可用' in z:
              bad.append(x.get('title','unknown'))
          if bad:
            raise SystemExit(f'Translation validation failed for {len(bad)} abstracts: {bad[:3]}')
          if not html.startswith('<!doctype html>') or 'charset=UTF-8' not in html:
            raise SystemExit('HTML UTF-8 header validation failed.')
          hist=json.loads(pathlib.Path('data/weekly_history.json').read_text(encoding='utf-8'))
          hist_keys=set()
          for r in hist.get('papers',[]):
            for k,v in [('pmid',r.get('pmid')),('doi',r.get('doi')),('title',r.get('title'))]:
              if v: hist_keys.add(k+':'+re.sub(r'[^a-z0-9]+','',str(v).lower()) if k=='title' else k+':'+str(v).lower())
          for r in payload.get('papers',[]):
            keys=[]
            if r.get('pmid'): keys.append('pmid:'+str(r['pmid']).lower())
            if r.get('doi'): keys.append('doi:'+str(r['doi']).lower().replace('https://doi.org/',''))
            if r.get('title'): keys.append('title:'+re.sub(r'[^a-z0-9]+','',str(r['title']).lower()))
            if any(k in hist_keys for k in keys):
              raise SystemExit('History validation failed: newly selected paper already exists in history.')
          print('Translation, UTF-8, and history validation passed.')
          PY
      - name: Send weekly brief to QQ mailbox
        env:
          QQ_SMTP_PASSWORD: ${{ secrets.QQMAIL }}
          QQ_SENDER_EMAIL: 171142515@qq.com
          QQ_RECEIVER_EMAIL: 171142515@qq.com
        run: |
          python code/send_weekly_email.py \
            --html Output/weekly/$(date +%F).html \
            --md Output/weekly/$(date +%F).md \
            --json Output/weekly/$(date +%F).json
      - name: Update persistent literature history after successful email
        run: python code/update_weekly_history.py --report Output/weekly/$(date +%F).json --history data/weekly_history.json
      - name: Commit updated literature history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly_history.json
          if git diff --cached --quiet; then
            echo 'No history changes to commit.'
          else
            git commit -m 'Update weekly literature history'
            git push
          fi
      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-lipid-weekly-brief-${{ github.run_number }}
          path: Output/weekly/
          if-no-files-found: warn
