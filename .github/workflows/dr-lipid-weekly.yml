name: DR lipid weekly brief

on:
  push:
    branches: [dr-lipid-daily]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Monday 08:00 China/Singapore time (UTC+8)

permissions:
  contents: read
  models: read

jobs:
  weekly-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests

      - name: Resolve QQ SMTP secret without exposing its value
        env:
          QQ_SMTP_PASSWORD: ${{ secrets.QQ_SMTP_PASSWORD }}
          QQ_EMAIL_PASSWORD: ${{ secrets.QQ_EMAIL_PASSWORD }}
          QQ_PASSWORD: ${{ secrets.QQ_PASSWORD }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
        run: |
          if [ -n "$QQ_SMTP_PASSWORD" ]; then
            echo 'QQ mail credential source: QQ_SMTP_PASSWORD'
            printf '%s' "$QQ_SMTP_PASSWORD" > /tmp/qq_secret
          elif [ -n "$QQ_EMAIL_PASSWORD" ]; then
            echo 'QQ mail credential source: QQ_EMAIL_PASSWORD'
            printf '%s' "$QQ_EMAIL_PASSWORD" > /tmp/qq_secret
          elif [ -n "$QQ_PASSWORD" ]; then
            echo 'QQ mail credential source: QQ_PASSWORD'
            printf '%s' "$QQ_PASSWORD" > /tmp/qq_secret
          elif [ -n "$QQ_AUTH_CODE" ]; then
            echo 'QQ mail credential source: QQ_AUTH_CODE'
            printf '%s' "$QQ_AUTH_CODE" > /tmp/qq_secret
          else
            echo '::error::No supported QQ mail secret was found. Expected QQ_SMTP_PASSWORD, QQ_EMAIL_PASSWORD, QQ_PASSWORD, or QQ_AUTH_CODE.'
            exit 1
          fi
          printf 'QQ_SMTP_PASSWORD=' >> "$GITHUB_ENV"
          cat /tmp/qq_secret >> "$GITHUB_ENV"
          printf '\n' >> "$GITHUB_ENV"
          rm -f /tmp/qq_secret

      - name: Generate weekly bilingual brief with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1-mini
          WEEKLY_DAYS: '14'
          WEEKLY_PER_QUERY: '100'
          WEEKLY_TOP_N: '20'
          WEEKLY_MINIMUM_SCORE: '40'
          WEEKLY_OUTPUT_DIR: Output/weekly
        run: python code/run_weekly_brief_github_models.py

      - name: Send weekly brief to QQ mailbox
        env:
          QQ_SMTP_PASSWORD: ${{ env.QQ_SMTP_PASSWORD }}
          QQ_SENDER_EMAIL: 171142515@qq.com
          QQ_RECEIVER_EMAIL: 171142515@qq.com
        run: |
          python code/send_weekly_email.py \
            --html Output/weekly/$(date +%F).html \
            --md Output/weekly/$(date +%F).md \
            --json Output/weekly/$(date +%F).json

      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-lipid-weekly-brief-${{ github.run_number }}
          path: Output/weekly/
          if-no-files-found: warn
