name: DR lipid weekly brief

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # Monday 08:00 China/Singapore time (UTC+8)

permissions:
  contents: read

concurrency:
  group: dr-lipid-weekly-final-test
  cancel-in-progress: true

jobs:
  weekly-brief:
    if: startsWith(github.event.head_commit.message, '[TEST]') || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests
      - name: Check QQ mail secret without exposing its value
        env:
          QQMAIL: ${{ secrets.QQMAIL }}
        run: |
          if [ -z "$QQMAIL" ]; then
            echo '::error::Repository secret QQMAIL is unavailable to this workflow.'
            exit 1
          fi
          echo 'QQMAIL secret is available.'
      - name: Generate dynamic weekly brief
        env:
          WEEKLY_DAYS: '7'
          WEEKLY_PER_QUERY: '30'
          WEEKLY_MINIMUM_SCORE: '55'
          WEEKLY_HARD_MAX: '20'
          WEEKLY_OUTPUT_DIR: Output/weekly
          JCR_MAX_PAGES: '2'
        run: python code/weekly_brief.py
      - name: Validate report metrics before sending
        run: |
          python - <<'PY'
          import json, os, urllib.parse
          path = f"Output/weekly/{__import__('datetime').date.today().isoformat()}.json"
          data = json.load(open(path, encoding='utf-8'))
          papers = data.get('papers', [])
          if not papers:
              raise SystemExit('Validation failed: report contains no papers.')
          allowed = {'www.iikx.com','iikx.com','www.ablesci.com','ablesci.com','journalsimpactfactors.com','www.journalsimpactfactors.com'}
          bad = []
          for p in papers:
              m = p.get('journal_metrics') or {}
              src = m.get('metric_source') or ''
              url = m.get('metric_url') or ''
              host = urllib.parse.urlparse(url).netloc.lower()
              if 'Google web search' in src and host not in allowed:
                  bad.append((p.get('journal'), src, url))
          if bad:
              raise SystemExit('Validation failed: untrusted Google metric source detected: ' + repr(bad[:3]))
          complete = sum(1 for p in papers if (p.get('journal_metrics') or {}).get('jif') is not None and (p.get('journal_metrics') or {}).get('jcr_quartile') not in ('', '未检索到', None))
          print(f'Validation passed: papers={len(papers)}, complete_jcr_metrics={complete}')
          PY
      - name: Send weekly brief to QQ mailbox
        env:
          QQ_SMTP_PASSWORD: ${{ secrets.QQMAIL }}
          QQ_SENDER_EMAIL: 171142515@qq.com
          QQ_RECEIVER_EMAIL: 171142515@qq.com
        run: |
          python code/send_weekly_email.py \
            --html Output/weekly/$(date +%F).html \
            --md Output/weekly/$(date +%F).md \
            --json Output/weekly/$(date +%F).json
      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-lipid-weekly-brief-${{ github.run_number }}
          path: Output/weekly/
          if-no-files-found: warn
