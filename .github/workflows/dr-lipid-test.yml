name: DR lipid fallback validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install requests
      - name: Generate brief without email
        env:
          WEEKLY_DAYS: '21'
          WEEKLY_PER_QUERY: '80'
          WEEKLY_MINIMUM_SCORE: '55'
          WEEKLY_HARD_MAX: '60'
          WEEKLY_OUTPUT_DIR: Output/weekly-test
        run: python code/weekly_brief.py
      - name: Validate JSON invariants
        run: |
          python - <<'PY'
          import json, glob
          p = glob.glob('Output/weekly-test/*.json')[-1]
          x = json.load(open(p, encoding='utf-8'))
          papers = x['papers']
          assert len(papers) > 0
          keys=[]
          for r in papers:
              m=r.get('journal_metrics') or {}
              if m.get('jif') is None:
                  assert r.get('hard_included_due_to_missing_jcr') is True
                  assert '硬纳入' in r.get('jcr_metric_note','')
              keys.append((r.get('pmid'), r.get('doi'), r.get('title')))
          assert len(keys) == len(set(map(str, keys))), 'duplicate output keys detected'
          print('VALIDATION_OK', len(papers), 'papers', 'jcr_missing=', x.get('jcr_missing_hard_included'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr-lipid-fallback-validation-${{ github.run_number }}
          path: Output/weekly-test/
          if-no-files-found: warn
