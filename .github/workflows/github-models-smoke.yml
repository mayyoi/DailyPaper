name: GitHub Models smoke test

on:
  push:
    branches: [dr-lipid-daily]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  github-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Test GitHub Models inference
        id: inference
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json
          url = 'https://models.github.ai/inference/chat/completions'
          body = {
              'model': 'openai/gpt-4.1-mini',
              'messages': [{'role': 'user', 'content': 'Reply with exactly: GITHUB_MODELS_OK'}],
              'temperature': 0,
              'max_tokens': 20,
          }
          r = requests.post(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
              },
              json=body,
              timeout=60,
          )
          diagnostic = {'status_code': r.status_code, 'headers': dict(r.headers), 'body': r.text[:10000]}
          open('github_models_response.json', 'w', encoding='utf-8').write(json.dumps(diagnostic, ensure_ascii=False, indent=2))
          print('status=', r.status_code)
          print('response_body=', r.text[:2000])
          r.raise_for_status()
          data = r.json()
          text = data['choices'][0]['message']['content'].strip()
          print('model_response=', text)
          assert text == 'GITHUB_MODELS_OK', text
          PY
      - name: Upload GitHub Models diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-models-diagnostic-${{ github.run_number }}
          path: github_models_response.json
          if-no-files-found: warn
      - name: Fail if inference failed
        if: steps.inference.outcome != 'success'
        run: exit 1
