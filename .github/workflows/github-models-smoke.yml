name: GitHub Models smoke test

on:
  push:
    branches: [dr-lipid-daily]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  github-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Test GitHub Models inference
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          url = 'https://models.github.ai/inference/chat/completions'
          body = {
              'model': 'openai/gpt-4.1-mini',
              'messages': [
                  {'role': 'user', 'content': 'Reply with exactly: GITHUB_MODELS_OK'}
              ],
              'temperature': 0,
              'max_tokens': 20,
          }
          r = requests.post(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
              },
              json=body,
              timeout=60,
          )
          print('status=', r.status_code)
          r.raise_for_status()
          data = r.json()
          text = data['choices'][0]['message']['content'].strip()
          print('model_response=', text)
          assert text == 'GITHUB_MODELS_OK', text
          PY
